name: TVApp

options:
  bundleIdPrefix: com.atvcast
  createIntermediateGroups: true
  deploymentTarget:
    tvOS: "17.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  TVApp:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: TVApp/Sources
    settings:
      base:
        PRODUCT_NAME: TVApp
        PRODUCT_BUNDLE_IDENTIFIER: com.atvcast.tvapp
        INFOPLIST_FILE: TVApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"

schemes:
  TVApp:
    build:
      targets:
        TVApp: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
